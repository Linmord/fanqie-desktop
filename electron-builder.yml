appId: com.fanqie.desktop
productName: 番茄小说
# 发布资产用纯 ASCII 文件名，避免 GitHub Release 把中文名改乱
artifactName: fanqie-desktop-${version}-${os}-${arch}.${ext}
# 打包时写入 app-update.yml，客户端据此从 GitHub Release 检查更新
publish:
  provider: github
  owner: MoYiC6
  repo: fanqie-desktop
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
mac:
  category: public.app-category.books
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
