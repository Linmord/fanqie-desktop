name: 多平台打包发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac-arm64
            triple: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            label: mac-x64
            triple: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            label: win-x64
            triple: ''
            bundles: nsis
          - os: ubuntu-22.04
            label: linux-x86_64
            triple: ''
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: 打包
        shell: bash
        run: |
          if [ -n "${{ matrix.triple }}" ]; then
            npx tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.triple }}
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi

      # 发布资产用纯 ASCII 文件名，避免 GitHub Release 把中文名改乱
      - name: 整理产物
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "${{ matrix.triple }}" ]; then
            bundle="src-tauri/target/${{ matrix.triple }}/release/bundle"
          else
            bundle="src-tauri/target/release/bundle"
          fi
          mkdir -p out
          found=0
          for f in "$bundle"/*/*.dmg "$bundle"/*/*.exe "$bundle"/*/*.AppImage; do
            [ -f "$f" ] || continue
            cp "$f" "out/fanqie-desktop-${version}-${{ matrix.label }}.${f##*.}"
            found=1
          done
          [ "$found" = 1 ] || { echo "没有找到安装包：$bundle"; exit 1; }
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
